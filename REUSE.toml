# Licence information for files that cannot carry a comment header (JSON, the README's screenshot)
version = 1

[[annotations]]
path = ["CMakePresets.json", "src/plugin/kortoisegitplugin.json", "screenshot.png"]
SPDX-FileCopyrightText = "2026 James Jones <this.verb@gmail.com>"
SPDX-License-Identifier = "GPL-2.0-or-later"

# The app icon, original artwork built by data/icons/make-icon.sh
[[annotations]]
path = ["data/icons/*.png", "data/icons/*.pcraft"]
SPDX-FileCopyrightText = "2026 James Jones <this.verb@gmail.com>"
SPDX-License-Identifier = "GPL-2.0-or-later"

# The log list's action icons, converted to PNG from TortoiseGit src/Resources/action*.ico, and that folder's
# licence notice. license.txt offers them under the GPL or the TortoiseSVN Icon License; we take the GPL. The shipped
# icons are recoloured by scripts/recolour-icons.sh from the unmodified originals in src/proc/icons/original/.
[[annotations]]
path = ["src/proc/icons/*.png", "src/proc/icons/original/*.png", "src/proc/icons/license.txt"]
SPDX-FileCopyrightText = ["2006-2007 The TortoiseSVN Project", "2008-2026 TortoiseGit"]
SPDX-License-Identifier = "GPL-2.0-or-later"

# tl-expected 1.3.1 (https://github.com/TartanLlama/expected), vendored byte-identical to upstream, so it cannot take
# an SPDX header. Its own header dedicates it to the public domain under CC0.
[[annotations]]
path = "src/utils/expected.hpp"
SPDX-FileCopyrightText = "2017 Sy Brand <tartanllama@gmail.com>"
SPDX-License-Identifier = "CC0-1.0"
